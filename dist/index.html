<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackBook | Offensive Security Platform</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <style>
        /* ── Dark theme (default) ── */
        :root,
        [data-theme="dark"] {
            --htb-green: #9fef00;
            --htb-bg: #05080a;
            --htb-surface: #0b1217;
            --htb-border: #1a232e;
            --htb-text: #ffffff;
            --htb-text-muted: #94a3b8;
            --htb-text-faint: rgba(255, 255, 255, 0.4);
            --htb-overlay: rgba(255, 255, 255, 0.05);
            --htb-overlay-hover: rgba(255, 255, 255, 0.1);
            --htb-overlay-border: rgba(255, 255, 255, 0.1);
            --htb-dots: #1e293b;
            --htb-scrollbar-thumb: #1e293b;
            --htb-scrollbar-thumb-hover: #334155;
            --htb-navbar-bg: rgba(5, 8, 10, 0.80);
            --htb-navbar-border: rgba(255, 255, 255, 0.05);
            --htb-code-bg: #05080a;
            --htb-input-bg: rgba(255, 255, 255, 0.03);
            --htb-input-border: rgba(255, 255, 255, 0.05);
            --htb-tag-bg: rgba(255, 255, 255, 0.05);
            --htb-tag-border: rgba(255, 255, 255, 0.08);
            --htb-kbd-bg: rgba(255, 255, 255, 0.05);
            --htb-shadow: rgba(0, 0, 0, 0.5);
            color-scheme: dark;
        }

        /* ── Light theme ── */
        [data-theme="light"] {
            --htb-green: #5cb800;
            --htb-bg: #f8f9fa;
            --htb-surface: #ffffff;
            --htb-border: #e9ecef;
            --htb-text: #1a1f26;
            --htb-text-muted: #64748b;
            --htb-text-faint: rgba(26, 31, 38, 0.45);
            --htb-overlay: rgba(0, 0, 0, 0.04);
            --htb-overlay-hover: rgba(0, 0, 0, 0.06);
            --htb-overlay-border: rgba(0, 0, 0, 0.08);
            --htb-dots: #e2e8f0;
            --htb-scrollbar-thumb: #cbd5e1;
            --htb-scrollbar-thumb-hover: #94a3b8;
            --htb-navbar-bg: #ffffff;
            --htb-navbar-border: rgba(0, 0, 0, 0.08);
            --htb-code-bg: #0f172a;
            --htb-input-bg: #ffffff;
            --htb-input-border: #cbd5e1;
            --htb-tag-bg: #f1f5f9;
            --htb-tag-border: #e2e8f0;
            --htb-kbd-bg: #f1f5f9;
            --htb-shadow: rgba(0, 0, 0, 0.05);
            color-scheme: light;
        }

        body {
            font-family: 'Sora', 'Inter', sans-serif;
            background-color: var(--htb-bg);
            color: var(--htb-text);
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Theme-aware text classes */
        .htb-text {
            color: var(--htb-text);
        }

        .htb-text-muted {
            color: var(--htb-text-muted);
        }

        .htb-text-faint {
            color: var(--htb-text-faint);
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .grid-dots {
            background-image: radial-gradient(var(--htb-dots) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .htb-btn {
            @apply font-semibold transition-all duration-200 active:scale-95;
            border-radius: 8px;
        }

        .htb-card {
            background-color: var(--htb-surface);
            border: 1px solid var(--htb-border);
            border-radius: 12px;
            @apply transition-all duration-300;
        }

        h1,
        h2,
        h3,
        h4,
        .font-heading {
            font-family: 'Sora', sans-serif;
            letter-spacing: -0.02em;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--htb-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--htb-scrollbar-thumb);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--htb-scrollbar-thumb-hover);
        }

        /* ══════════════════════════════════════════════════════════
        /* ══════════════════════════════════════════════════════════
           LIGHT MODE: DEFINITIVE TEXT CONTRAST ENGINE
           ══════════════════════════════════════════════════════════ */

        /* Base text overrides */
        [data-theme="light"] .text-white,
        [data-theme="light"] .text-slate-50,
        [data-theme="light"] .text-gray-50,
        [data-theme="light"] .text-zinc-50 {
            color: var(--htb-text) !important;
        }

        /* Opacity variants - Exhaustive Sweep */
        [data-theme="light"] .text-white\/95 {
            color: rgba(0, 0, 0, 0.95) !important;
        }

        [data-theme="light"] .text-white\/90 {
            color: rgba(0, 0, 0, 0.90) !important;
        }

        [data-theme="light"] .text-white\/80 {
            color: rgba(0, 0, 0, 0.85) !important;
        }

        [data-theme="light"] .text-white\/75 {
            color: rgba(0, 0, 0, 0.80) !important;
        }

        [data-theme="light"] .text-white\/70 {
            color: rgba(0, 0, 0, 0.75) !important;
        }

        [data-theme="light"] .text-white\/60 {
            color: #334155 !important;
        }

        [data-theme="light"] .text-white\/50 {
            color: #475569 !important;
        }

        [data-theme="light"] .text-white\/45 {
            color: #475569 !important;
        }

        [data-theme="light"] .text-white\/40 {
            color: #64748b !important;
        }

        [data-theme="light"] .text-white\/35 {
            color: #64748b !important;
        }

        [data-theme="light"] .text-white\/30 {
            color: #94a3b8 !important;
        }

        [data-theme="light"] .text-white\/20 {
            color: #94a3b8 !important;
        }

        [data-theme="light"] .text-white\/10 {
            color: #cbd5e1 !important;
        }

        /* Muted slate variants */
        [data-theme="light"] .text-slate-500 {
            color: #334155 !important;
        }

        [data-theme="light"] .text-slate-400 {
            color: #475569 !important;
        }

        [data-theme="light"] .text-slate-300 {
            color: #1e293b !important;
        }

        /* Hover States (Individual, Group, and Peer) */
        [data-theme="light"] .hover\:text-white:hover,
        [data-theme="light"] .group:hover .group-hover\:text-white,
        [data-theme="light"] .group:hover .group-hover\:text-white\/70,
        [data-theme="light"] .group:hover .group-hover\:text-white\/60,
        [data-theme="light"] .group:hover .group-hover\:text-slate-300 {
            color: var(--htb-text) !important;
        }

        /* Specific Component Overrides */
        [data-theme="light"] nav .text-white {
            color: var(--htb-text) !important;
        }

        [data-theme="light"] nav .text-white\/60 {
            color: #334155 !important;
        }

        /* Forced Input/Textarea visibility */
        [data-theme="light"] input,
        [data-theme="light"] textarea {
            color: var(--htb-text) !important;
        }

        [data-theme="light"] input::placeholder,
        [data-theme="light"] textarea::placeholder,
        [data-theme="light"] .placeholder-white\/20::placeholder {
            color: #64748b !important;
            opacity: 1 !important;
            -webkit-text-fill-color: #64748b !important;
        }

        /* --- UI Elements: Backgrounds & Overlays --- */
        [data-theme="light"] .bg-white\/10 {
            background-color: rgba(0, 0, 0, 0.06) !important;
        }

        [data-theme="light"] .bg-white\/8 {
            background-color: rgba(0, 0, 0, 0.05) !important;
        }

        [data-theme="light"] .bg-white\/5 {
            background-color: rgba(0, 0, 0, 0.03) !important;
        }

        [data-theme="light"] .hover\:bg-white\/5:hover {
            background-color: rgba(0, 0, 0, 0.05) !important;
        }

        [data-theme="light"] .hover\:bg-white\/10:hover {
            background-color: rgba(0, 0, 0, 0.08) !important;
        }

        /* --- Borders --- */
        [data-theme="light"] .border-white\/20 {
            border-color: rgba(0, 0, 0, 0.18) !important;
        }

        [data-theme="light"] .border-white\/10 {
            border-color: rgba(0, 0, 0, 0.14) !important;
        }

        [data-theme="light"] .border-white\/5 {
            border-color: rgba(0, 0, 0, 0.10) !important;
        }

        [data-theme="light"] .border-white\/\[0\.08\] {
            border-color: rgba(0, 0, 0, 0.15) !important;
        }

        /* --- Search Modal Polish --- */
        [data-theme="light"] .bg-black\/60 {
            background-color: rgba(255, 255, 255, 0.98) !important;
        }

        [data-theme="light"] .bg-black\/70 {
            background-color: rgba(0, 0, 0, 0.15) !important;
        }

        [data-theme="light"] input::placeholder,
        [data-theme="light"] textarea::placeholder,
        [data-theme="light"] .placeholder-white\/20::placeholder {
            color: rgba(0, 0, 0, 0.4) !important;
            opacity: 1 !important;
            -webkit-text-fill-color: rgba(0, 0, 0, 0.4) !important;
        }

        /* --- Nuclear Tool & UI Overrides --- */
        [data-theme="light"] nav[class*="bg-"] {
            background-color: var(--htb-navbar-bg) !important;
        }

        [data-theme="light"] .bg-\[\#05080a\] {
            background-color: var(--htb-bg) !important;
        }

        [data-theme="light"] .bg-\[\#070b10\] {
            background-color: #f1f5f9 !important;
        }

        [data-theme="light"] .bg-\[\#101821\]\/96 {
            background-color: #ffffff !important;
        }

        [data-theme="light"] .bg-\[\#141d26\]\/94 {
            background-color: #ffffff !important;
        }

        [data-theme="light"] .bg-\[\#111921\]\/92 {
            background-color: #f1f5f9 !important;
        }

        [data-theme="light"] .bg-\[\#0a0f16\]\/60 {
            background-color: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
        }

        [data-theme="light"] .bg-\[\#16202a\] {
            background-color: #f1f5f9 !important;
        }

        [data-theme="light"] .bg-\[\#0b1217\] {
            background-color: var(--htb-surface) !important;
        }

        /* ── CodeBlock Protection ── */
        [data-theme="light"] [data-code-block],
        [data-theme="light"] [data-code-block] .bg-\[\#0a0f16\],
        [data-theme="light"] [data-code-block] [class*="bg-[#0a0f16]"] {
            background-color: #0f172a !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        [data-theme="light"] [data-code-block] * {
            color: inherit;
        }

        [data-theme="light"] [data-code-block] .text-white\/30 {
            color: rgba(255, 255, 255, 0.3) !important;
        }

        /* ══════════════════════════════════════════════════════════
           CLEANUP: Shadows, Glows & ATMOSPHERE
           ══════════════════════════════════════════════════════════ */
        [data-theme="light"] *:not([data-code-block] *):not(.theme-toggle-btn *) {
            box-shadow: none !important;
            text-shadow: none !important;
            filter: none !important;
        }

        [data-theme="light"] [class*="shadow-"] {
            box-shadow: none !important;
        }

        /* THE VIGNETTE KILLER */
        [data-theme="light"] html,
        [data-theme="light"] body,
        [data-theme="light"] #root,
        [data-theme="light"] div[class*="bg-[radial-gradient"] {
            box-shadow: none !important;
            background-image: none !important;
            background-color: var(--htb-bg) !important;
        }

        [data-theme="light"] body::before,
        [data-theme="light"] body::after,
        [data-theme="light"] html::before,
        [data-theme="light"] html::after {
            display: none !important;
            content: none !important;
        }

        [data-theme="light"] .htb-card {
            border-color: #e2e8f0 !important;
            background-color: #ffffff !important;
        }

        [data-theme="light"] .htb-card:hover {
            border-color: #cbd5e1 !important;
        }

        /* Theme toggle button animation */
        .theme-toggle-btn {
            position: relative;
            overflow: hidden;
        }

        .theme-toggle-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.2s;
            background: radial-gradient(circle, rgba(159, 239, 0, 0.15) 0%, transparent 70%);
        }

        .theme-toggle-btn:hover::after {
            opacity: 1;
        }

        @keyframes spin-in {
            from {
                transform: rotate(-90deg) scale(0.6);
                opacity: 0;
            }

            to {
                transform: rotate(0deg) scale(1);
                opacity: 1;
            }
        }
    </style>

    <link rel="stylesheet" href="/index.css">
    <!-- Anti-FOUC: apply saved theme before React mounts -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('hackbook_theme');
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch (e) { }
        })();
    </script>
